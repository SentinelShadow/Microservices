server:
  port: 8090
spring:
  application:
    name: loan
  datasource:
    url: jdbc:mysql://localhost:3306/loandb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:8071/"
  profiles:
    active:
      - "prod"
management:
  endpoints:
    web:
      exposure:
        include: "*"

